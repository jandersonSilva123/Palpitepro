<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GolZen - Banco Mundial de Times</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#092719,#030706 55%);
  color:#fff;
  min-height:100vh;
  padding:20px;
}

.wrap{
  max-width:1100px;
  margin:auto;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0 25px;
  border-bottom:1px solid #173b29;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#39ff68;
}

.logo span{
  color:#fff;
}

.back{
  color:#39ff68;
  text-decoration:none;
  font-weight:bold;
}

.card{
  margin-top:25px;
  padding:22px;
  border:1px solid #173b29;
  border-radius:20px;
  background:#06100c;
}

h1{
  font-size:27px;
  margin-bottom:8px;
}

.sub{
  color:#94a3a8;
  line-height:1.6;
  margin-bottom:20px;
}

label{
  display:block;
  color:#cbd5d1;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #254b36;
  background:#030806;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#00d819;
}

.status{
  margin-top:15px;
  color:#94a3a8;
  font-size:14px;
}

.liga{
  margin-top:22px;
  color:#39ff68;
  font-size:19px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:15px;
}

.team{
  padding:16px;
  text-align:center;
  border:1px solid #173b29;
  border-radius:15px;
  background:#030806;
}

.badge{
  width:65px;
  height:65px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:5px auto 10px;
  background:#092719;
  border:1px solid #254b36;
  font-size:30px;
}

.team strong{
  display:block;
  font-size:14px;
}

.team small{
  display:block;
  color:#7f9088;
  margin-top:6px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:30px;
  color:#94a3a8;
}

.note{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  background:#241d05;
  border:1px solid #4b3c0b;
  color:#facc15;
  font-size:12px;
  line-height:1.6;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .team{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="logo">⚽ Gol<span>Zen</span></div>
  <a class="back" href="index.html">← Voltar</a>
</header>

<section class="card">

<h1>🌎 Banco Mundial de Times</h1>

<p class="sub">
Pesquise todos os principais clubes em uma única busca.
Digite o nome do time, país ou campeonato.
</p>

<label for="search">
🔎 Buscar time
</label>

<input
id="search"
type="search"
autocomplete="off"
placeholder="Ex.: Flamengo, Real Madrid, Liverpool..."
>

<div id="status" class="status"></div>

<div class="liga">
⚽ Principais clubes do mundo
</div>

<div id="teams" class="grid"></div>

<div class="note">
ℹ️ Digite qualquer parte do nome do clube, país ou campeonato para encontrar os times.
</div>

</section>

</div>

function normalizar(nome){

return String(nome || "")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]/g,"");

}


/* MOSTRAR CLUBES */

function renderTeams(){

const termo =
normalizar(search.value);

const resultados =
clubes.filter(clube => {

const nome =
normalizar(clube[0]);

const pais =
normalizar(clube[1]);

const liga =
normalizar(clube[2]);

return nome.includes(termo)
|| pais.includes(termo)
|| liga.includes(termo);

});


statusBox.textContent =
termo
?
`🔎 ${resultados.length} clube(s) encontrado(s).`
:
`🌎 ${clubes.length} clubes disponíveis.`;


if(!resultados.length){

teamsBox.innerHTML =
'<div class="empty">⚠️ Nenhum time encontrado.<br><br>Tente outro nome.</div>';

return;

}


teamsBox.innerHTML =
resultados.map(clube => `

<div class="team">

<div class="badge">
⚽
</div>

<strong>
${clube[0]}
</strong>

<small>
${clube[1]} • ${clube[2]}
</small>

</div>

`).join("");

}


/* PESQUISA AUTOMÁTICA */

search.addEventListener(
"input",
renderTeams
);


/* INICIAR */

renderTeams();

</script>

</body>
</html>

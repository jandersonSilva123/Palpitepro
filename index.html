<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PalpitePro</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#050816;color:white}
header{text-align:center;padding:28px 15px;background:#101d45}
h1{margin:0;color:#22c55e;font-size:36px}
header p{color:#cbd5e1}
main{max-width:700px;margin:auto;padding:20px}
.card{background:#10182d;border:1px solid #334155;border-radius:18px;padding:20px;margin-bottom:18px}
.title{font-size:23px;font-weight:bold;margin-bottom:18px}
input{width:100%;padding:16px;margin:7px 0;border-radius:10px;border:1px solid #475569;background:#020617;color:white;font-size:17px}
button{width:100%;padding:17px;margin-top:12px;border:0;border-radius:12px;background:#16a34a;color:white;font-size:18px;font-weight:bold}
button:active{transform:scale(.98)}
.result{margin-top:18px;padding:18px;background:#020617;border-radius:12px;line-height:1.8;font-size:17px}
footer{text-align:center;color:#64748b;padding:30px}
</style>
</head>

<body>

<header>
<h1>⚽ PalpitePro</h1>
<p>Seus palpites esportivos em um só lugar</p>
</header>

<main>

<div class="card">
<div class="title">🎯 Gerar Palpite</div>

<input id="timeA" placeholder="Nome do Time A">
<input id="timeB" placeholder="Nome do Time B">

<button onclick="gerarPalpite()">GERAR PALPITE</button>

<div id="resultado" class="result">
Digite os dois times para começar.
</div>
</div>

<div class="card">
<div class="title">📊 Informações</div>

<p>Probabilidade: <b id="prob">--</b></p>
<p>Gols esperados: <b id="gols">--</b></p>
<p>Resultado sugerido: <b id="placar">--</b></p>

</div>

</main>

<footer>
PalpitePro © 2026
</footer>

<script>
function gerarPalpite(){

let a=document.getElementById("timeA").value.trim();
let b=document.getElementById("timeB").value.trim();

if(!a || !b){
alert("Digite os dois times.");
return;
}

let prob=Math.floor(Math.random()*21)+60;
let gols=(Math.random()*2+1).toFixed(1);

let placarA=Math.floor(Math.random()*4);
let placarB=Math.floor(Math.random()*4);

document.getElementById("prob").textContent=prob+"%";
document.getElementById("gols").textContent=gols;
document.getElementById("placar").textContent=
placarA+" x "+placarB;

document.getElementById("resultado").innerHTML=
"⚽ <b>"+a+" x "+b+"</b><br>"+
"🎯 Palpite gerado com sucesso!<br>"+
"📌 Resultado sugerido: <b>"+placarA+" x "+placarB+"</b>";
}
</script>

</body>
</html>

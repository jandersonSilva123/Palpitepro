name: Build PalpitePro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar Android SDK
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0" 
          
          
          
          

          - name: Preparar projeto
         run: |
          unzip -o -q PalpitePro_Cloud_Build.zip
          GRADLEW_PATH=$(find . -type f -name gradlew | head -1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew não encontrado no ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW_PATH"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon
        
          
          

      
        
          
          

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PalpitePro-debug-apk
          path: projeto/app/build/outputs/apk/debug/*.apk

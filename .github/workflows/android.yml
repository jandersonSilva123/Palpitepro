name: Build PalpitePro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Preparar projeto
        run: |
          unzip -q PalpitePro_Cloud_Build.zip
          chmod +x projeto/gradlew

      - name: Compilar APK
        run: |
          cd projeto
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PalpitePro-debug-apk
          path: projeto/app/build/outputs/apk/debug/*.apk
